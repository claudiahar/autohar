<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />

    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
      (function () {
        var p = window.location.search.match(/[?&]p=([^&]+)/);
        if (p) {
          var path = decodeURIComponent(p[1]);
          window.history.replaceState(null, null, "/" + path);
        }
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Piese Auto din Dezmembrări Suceava | Auto Har</title>

    <meta
      name="description"
      content="Piese auto din dezmembrări Suceava - Auto Har oferă piese originale second-hand pentru toate mărcile. Import din Belgia, Spania, Germania, Italia."
    />

    />

    <!-- Open Graph -->

    <meta name="geo.region" content="RO-SV" />

    <meta name="geo.position" content="47.6517;26.2458" />
    <meta name="ICBM" content="47.6517, 26.2458" />

    <link rel="canonical" href="https://pieseautohar.ro" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- GA + Google Ads – pornesc DOAR după accept cookies -->
    <script>
      function loadTracking() {
        if (window.trackingLoaded) return;
        window.trackingLoaded = true;

        const s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-806DL60HS1";
        document.head.appendChild(s);

        s.onload = () => {
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;

          gtag("js", new Date());

          /* Google Analytics */
          gtag("config", "G-806DL60HS1");

          /* Google Ads */
          gtag("config", "AW-1786396839");
        };
      }

      document.addEventListener("DOMContentLoaded", () => {
        if (localStorage.getItem("cookiesAccepted") === "true") {
          loadTracking();
        }
      });
    </script>
  </head>

  <body>
    <!-- COOKIE BANNER GDPR -->
    <div
      id="cookie-banner"
      style="
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #1f2937;
        color: #ffffff;
        padding: 14px;
        font-size: 14px;
        z-index: 9999;
        text-align: center;
        display: none;
      "
    >
      Acest site folosește cookie-uri pentru analiză și funcționalitate.
      <button
        id="accept-cookies"
        style="
          margin-left: 12px;
          background: #dc2626;
          color: #fff;
          border: none;
          padding: 8px 14px;
          border-radius: 4px;
          cursor: pointer;
        "
      >
        Accept
      </button>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const banner = document.getElementById("cookie-banner");
        const btn = document.getElementById("accept-cookies");

        if (!localStorage.getItem("cookiesAccepted")) {
          banner.style.display = "block";
        }

        btn.addEventListener("click", function () {
          localStorage.setItem("cookiesAccepted", "true");
          banner.style.display = "none";
          loadTracking();
        });
      });
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
